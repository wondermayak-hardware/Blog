name: Daily blog
on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST every day
  workflow_dispatch:
    inputs:
      idea_id:
        description: "Optional: force a specific idea number (leave empty for the next unused idea)"
        required: false
permissions:
  contents: write
concurrency:
  group: daily-blog
  cancel-in-progress: false
jobs:
  blog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - name: Write today's post
        run: python bot/main.py generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IDEA_ID: ${{ inputs.idea_id }}
      - name: Check the site still builds with the new post
        run: python build.py
      - name: Publish to main (Cloudflare deploys it)
        run: bash scripts/publish.sh
      - name: Send the link on Telegram
        run: python bot/main.py notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Tell me on Telegram if the run failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="Blog bot run failed today. Open GitHub > Actions > Daily blog to see why. The idea was not used up."
